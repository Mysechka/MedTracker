name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup JDK для сборки Android-головы
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - name: Восстановить workloads
        run: dotnet workload restore MedTracker.slnx

      - name: Восстановить пакеты
        run: dotnet restore MedTracker.slnx

      - name: Сборка
        run: dotnet build MedTracker.slnx --configuration Release --no-restore

      - name: Тесты домена
        run: dotnet test tests/Med.Domain.Tests --configuration Release --no-build --logger "trx;LogFileName=domain.trx"

      - name: Тесты прикладного слоя
        run: dotnet test tests/Med.Application.Tests --configuration Release --no-build --logger "trx;LogFileName=application.trx"

      - name: Тесты инфраструктуры
        run: dotnet test tests/Med.Infrastructure.Tests --configuration Release --no-build --logger "trx;LogFileName=infrastructure.trx"

      - name: Тесты Presentation
        run: dotnet test tests/Med.Presentation.Tests --configuration Release --no-build --logger "trx;LogFileName=presentation.trx"

      - name: Результаты тестов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

      - name: Подготовка Keystore для подписи Android
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p /tmp/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/keystore/medtracker-release.keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Сборка Android APK
        run: build/android/make-apk.sh
        env:
          MEDTRACKER_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && '/tmp/keystore/medtracker-release.keystore' || '' }}
          MEDTRACKER_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          MEDTRACKER_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MEDTRACKER_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}

      - name: APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: medtracker-android-apk
          path: artifacts/android/*.apk
          if-no-files-found: error

  # Бандл собирается только на macOS: codesign есть лишь там.
  # При наличии секретов подписывается Developer ID и нотаризуется.
  macos-bundle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Сборка macOS-бандла
        run: build/macos/make-app-bundle.sh
        env:
          RID: osx-arm64
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY || '-' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Бандл как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: medtracker-macos-arm64
          path: artifacts/macos/osx-arm64/MedTracker.app
          if-no-files-found: error
