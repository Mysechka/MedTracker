name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup JDK для сборки Android-головы
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - name: Восстановить workloads
        run: dotnet workload restore MedTracker.slnx

      - name: Восстановить пакеты
        run: dotnet restore MedTracker.slnx

      - name: Сборка
        run: dotnet build MedTracker.slnx --configuration Release --no-restore

      - name: Тесты домена
        run: dotnet test tests/Med.Domain.Tests --configuration Release --no-build --logger "trx;LogFileName=domain.trx"

      - name: Тесты прикладного слоя
        run: dotnet test tests/Med.Application.Tests --configuration Release --no-build --logger "trx;LogFileName=application.trx"

      - name: Тесты инфраструктуры
        run: dotnet test tests/Med.Infrastructure.Tests --configuration Release --no-build --logger "trx;LogFileName=infrastructure.trx"

      - name: Тесты Presentation
        run: dotnet test tests/Med.Presentation.Tests --configuration Release --no-build --logger "trx;LogFileName=presentation.trx"

      - name: Результаты тестов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  # Бандл собирается только на macOS: codesign есть лишь там.
  # Подпись ad-hoc, без Developer ID и нотаризации — см. docs/build/macos.md.
  macos-bundle:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Сборка macOS-бандла
        run: build/macos/make-app-bundle.sh
        env:
          RID: osx-arm64

      - name: Бандл как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: medtracker-macos-arm64
          path: artifacts/macos/osx-arm64/MedTracker.app
          if-no-files-found: error
